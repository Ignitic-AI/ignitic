# Ignitic — full local stack
#
#   cp .env.example .env        # then set OPENROUTER_API_KEY
#   docker compose up -d --build
#
# Frontend  http://localhost:3000
# Backend   http://localhost:8080   (Swagger: /swagger/index.html)
# AI Engine http://localhost:8010
# MCP       http://localhost:8011
# RabbitMQ  http://localhost:15672
# Neo4j     http://localhost:7474
#
# Infra ports are bound to 127.0.0.1 so you can also run the apps natively
# against the containers:  docker compose up -d postgres redis rabbitmq mongo neo4j

name: ignitic

x-shared-secrets: &shared-secrets
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_ALGORITHM: HS256

services:
  # ─── Infrastructure ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ignitic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ignitic}
      POSTGRES_DB: ${POSTGRES_DB:-ignitic}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ignitic}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ignitic}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Atlas Local provides the vector search used by agent memory stores.
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ignitic-neo4j}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  # ─── Applications ───────────────────────────────────────────────────────
  backend:
    build:
      context: apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *shared-secrets
      SERVER_PORT: "8080"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AI_ENGINE_URL: http://ai-engine:8010
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-ignitic}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ignitic}
      DB_NAME: ${POSTGRES_DB:-ignitic}
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ignitic}:${RABBITMQ_PASSWORD:-ignitic}@rabbitmq:5672/
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SENDER_EMAIL: ${SENDER_EMAIL:-noreply@example.com}
      SENDER_NAME: Ignitic
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${PUBLIC_API_URL:-http://localhost:8080}/api/v1/google-oauth/callback
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES:-}
      SHOPIFY_OAUTH_STATE_SECRET: ${SHOPIFY_OAUTH_STATE_SECRET:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  ai-engine:
    build:
      context: .
      dockerfile: apps/ai-engine/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *shared-secrets
      HOST: 0.0.0.0
      PORT: "8010"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: "false"
      BACKEND_BASE_URL: http://backend:8080
      MCP_SERVER_URL: http://mcp:8011
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      DB_NAME: ignitic
      MONGO_DB_NAME: ignitic
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ignitic}:${RABBITMQ_PASSWORD:-ignitic}@rabbitmq:5672/
      PASS_ENCRYPTION_FERNET_KEY: ${PASS_ENCRYPTION_FERNET_KEY:?set PASS_ENCRYPTION_FERNET_KEY in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ignitic-neo4j}
      NEO4J_DATABASE: neo4j
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_SERVER_URL: http://n8n:5678/api/v1
    ports:
      - "${AI_ENGINE_PORT:-8010}:8010"

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    environment:
      <<: *shared-secrets
      HOST: 0.0.0.0
      PORT: "8011"
      DEBUG: "false"
      AI_ENGINE_BASE_URL: http://ai-engine:8010
      APIFY_TOKEN: ${APIFY_TOKEN:-}
    ports:
      - "${MCP_PORT:-8011}:8011"

  frontend:
    build:
      context: apps/frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_INTERNAL_URL: http://backend:8080
      NEXTAUTH_URL: ${FRONTEND_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # ─── Optional: workflow automation ──────────────────────────────────────
  #   docker compose --profile n8n up -d
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["n8n"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  mongo-data:
  mongo-config:
  neo4j-data:
  n8n-data:
