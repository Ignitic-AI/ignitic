swagger: "2.0"
basePath: /
host: localhost:8080
info:
  contact: {}
  description: API documentation for IgniticAI backend
  title: IgniticAI API
  version: "1.0"
securityDefinitions:
  BearerAuth:
    type: apiKey
    in: header
    name: Authorization
    description: JWT token for authentication. Format Bearer token
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token
      parameters:
      - description: Login data
        in: body
        name: loginData
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - auth
  /api/v1/auth/profile:
    get:
      description: Returns the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Updates the authenticated user's profile information
      parameters:
      - description: Profile update data
        in: body
        name: profileData
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - auth
  
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user and sends a verification email
      parameters:
      - description: User registration data
        in: body
        name: userData
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verifies a user's email using a code
      parameters:
      - description: Verification code
        in: body
        name: verifyData
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Verify email
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refreshes the user's JWT token if it's still valid
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Refresh JWT token
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Logs out the user (client should discard the token)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - auth
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the authenticated user's password after verifying current password
      parameters:
      - description: Password change data
        in: body
        name: passwordData
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - auth
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset token to the user's email
      parameters:
      - description: Password reset request data
        in: body
        name: resetData
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Request password reset
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets user password using a valid reset token
      parameters:
      - description: Password reset data
        in: body
        name: resetData
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Reset password with token
      tags:
      - auth
  /api/v1/secrets/{app}/{name}:
    put:
      consumes:
      - application/json
      description: Creates or updates a secret for an app and organization
      parameters:
      - name: app
        in: path
        required: true
        type: string
        description: App name
      - name: name
        in: path
        required: true
        type: string
        description: Secret name
      - name: body
        in: body
        required: true
        schema:
          type: object
        description: Secret data
      produces:
      - application/json
      responses:
        "201":
          description: Secret created successfully
          schema:
            type: object
        "200":
          description: Secret updated successfully
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: Create or update a secret
      tags:
      - secrets
    get:
      description: Retrieves and decrypts a secret for an app and organization
      parameters:
      - name: app
        in: path
        required: true
        type: string
        description: App name
      - name: name
        in: path
        required: true
        type: string
        description: Secret name
      produces:
      - application/json
      responses:
        "200":
          description: Decrypted secret
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
        "404":
          description: Secret not found
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: Get a secret
      tags:
      - secrets
    delete:
      description: Deletes a secret for an app and organization
      parameters:
      - name: app
        in: path
        required: true
        type: string
        description: App name
      - name: name
        in: path
        required: true
        type: string
        description: Secret name
      produces:
      - application/json
      responses:
        "200":
          description: Secret deleted successfully
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "404":
          description: Secret not found
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: Delete a secret
      tags:
      - secrets
  /api/v1/secrets/{app}:
    get:
      description: Lists all secrets for an app (without decryption)
      parameters:
      - name: app
        in: path
        required: true
        type: string
        description: App name
      produces:
      - application/json
      responses:
        "200":
          description: List of secrets
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: List secrets for an app
      tags:
      - secrets
    put:
      consumes:
      - application/json
      description: Bulk creates or updates secrets for an app
      parameters:
      - name: app
        in: path
        required: true
        type: string
        description: App name
      - name: body
        in: body
        required: true
        description: Bulk secrets payload
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Bulk upsert result
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: Bulk create or update secrets for an app
      tags:
      - secrets
    delete:
      description: Bulk deletes all secrets for an app the user can manage
      parameters:
      - name: app
        in: path
        required: true
        type: string
        description: App name
      produces:
      - application/json
      responses:
        "200":
          description: Bulk delete result
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: Bulk delete all secrets for an app
      tags:
      - secrets
  /api/v1/secrets/{app}/values:
    get:
      description: Lists all secrets for an app with decrypted values
      parameters:
      - name: app
        in: path
        required: true
        type: string
        description: App name
      produces:
      - application/json
      responses:
        "200":
          description: List of secrets with values
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: List secrets for an app with values
      tags:
      - secrets
  /api/v1/secrets/user/all:
    get:
      description: Lists all secrets for a user (personal + organization secrets they have access to)
      produces:
      - application/json
      responses:
        "200":
          description: List of secrets
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: List all secrets for a user
      tags:
      - secrets
  /api/v1/secrets/organization/{orgId}:
    get:
      description: Lists all secrets for an organization (only for admin/owner)
      parameters:
      - name: orgId
        in: path
        required: true
        type: string
        description: Organization ID
      produces:
      - application/json
      responses:
        "200":
          description: List of secrets
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: List all secrets for an organization
      tags:
      - secrets
  /api/v1/agents/ws:
    get:
      description: WebSocket endpoint for real-time agent communication (Upgrades to WebSocket)
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
        "401":
          description: Unauthorized
          schema:
            type: object
      summary: Agent WebSocket
      tags:
      - agents
  /api/v1/agents/chat:
    post:
      consumes:
      - application/json
      description: Queue an agent chat request for processing
      parameters:
      - name: body
        in: body
        required: true
        description: Agent chat request
        schema:
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: Request accepted and queued
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: Create agent chat request
      tags:
      - agents
  /api/v1/agents/chat/{request_id}:
    get:
      description: Get status for a queued agent chat request
      parameters:
      - name: request_id
        in: path
        required: true
        type: string
        description: Request ID
      produces:
      - application/json
      responses:
        "200":
          description: Status response
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      summary: Get agent chat status
      tags:
      - agents
  /api/v1/agents/status:
    get:
      description: Get agent system status and queue health
      produces:
      - application/json
      responses:
        "200":
          description: System status
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      summary: Agent system status
      tags:
      - agents
  /api/v1/agents/queues:
    get:
      description: Get request/response queue details
      produces:
      - application/json
      responses:
        "200":
          description: Queue information
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
      summary: Agent queues info
      tags:
      - agents
  /api/v1/agents/:
    get:
      security:
        - Bearer: []
      description: Proxies to AI engine to list available agents and their tools
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: List Agents
      tags:
      - agents
  /api/v1/agents/{agent}/tools:
    get:
      security:
        - Bearer: []
      description: Proxies to AI engine to list tools for a given agent
      produces:
        - application/json
      parameters:
        - name: agent
          in: path
          required: true
          type: string
          description: Agent name (e.g., product_researcher)
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: List Agent Tools
      tags:
      - agents
  /api/v1/agents/chats:
    get:
      security:
        - Bearer: []
      description: Proxies to AI engine to list chats for the authenticated user
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: List Chats
      tags:
      - agents
  /api/v1/agents/chats/{chat_id}:
    get:
      security:
        - Bearer: []
      description: Proxies to AI engine to fetch a single chat by ID
      produces:
        - application/json
      parameters:
        - name: chat_id
          in: path
          required: true
          type: string
          description: Chat ID
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Get Chat
      tags:
      - agents
  /api/v1/agents/chats/{chat_id}/messages:
    get:
      security:
        - Bearer: []
      description: Proxies to AI engine to fetch messages for a chat
      produces:
        - application/json
      parameters:
        - name: chat_id
          in: path
          required: true
          type: string
          description: Chat ID
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Get Chat Messages
      tags:
      - agents
  /api/v1/agents/chats/{chat_id}/messages:
    get:
      security:
        - Bearer: []
      description: Proxies to AI engine to fetch messages for a chat
      produces:
        - application/json
      parameters:
        - name: chat_id
          in: path
          required: true
          type: string
          description: Chat ID
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties: true
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Get Chat Messages
      tags:
      - agents
  

  /api/v1/workflow-template/n8n/import:
    post:
      summary: Import workflow from JSON
      description: Import an N8N workflow template from a JSON body.
      tags:
        - workflow
      consumes:
        - application/json
      produces:
        - application/json
      security:
        - BearerAuth: []
      parameters:
        - name: body
          in: body
          description: Workflow import data. This should contain the N8N workflow JSON structure.
          required: true
          schema:
            $ref: "#/definitions/N8nWorkflowImport"
      responses:
        "200":
          description: Workflow imported successfully
          schema:
            $ref: "#/definitions/WorkflowTemplate"
        "400":
          description: Invalid request or malformed N8N JSON
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/Error"

  /api/v1/workflow-template/n8n/:
    get:
      summary: Get workflow templates
      description: Retrieve a list of stored workflow templates.
      tags:
        - workflow
      produces:
        - application/json
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of records to return
          required: false
          type: integer
          default: 10
        - name: n8n_json
          in: query
          description: If true, include the full n8n_json structure in the response for each template.
          required: false
          type: boolean
          default: true
      responses:
        "200":
          description: List of workflow templates
          schema:
            type: array
            items:
              $ref: "#/definitions/WorkflowTemplate"
        "400":
          description: Invalid request (e.g., invalid limit value)
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/Error"

  /api/v1/workflow-template/n8n/{id}:
    get:
      summary: Get workflow template
      description: Retrieve a specific N8N workflow template by its ID.
      tags:
        - workflow
      produces:
        - application/json
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Workflow Template ID (e.g., UUID)
          required: true
          type: string
      responses:
        "200":
          description: Workflow template details
          schema:
            $ref: "#/definitions/WorkflowTemplate"
        "400":
          description: Invalid request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Workflow template not found
          schema:
            $ref: "#/definitions/Error"
    delete:
      summary: Delete workflow template
      description: Delete a specific N8N workflow template by its ID.
      tags:
        - workflow
      produces:
        - application/json
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Workflow Template ID (e.g., UUID)
          required: true
          type: string
      responses:
        "200":
          description: Workflow template deleted successfully
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Workflow template deleted successfully"
        "400":
          description: Invalid request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Workflow template not found
          schema:
            $ref: "#/definitions/Error"

definitions:
  N8nWorkflowImport:
    type: object
    description: The full N8N workflow JSON structure required for import.
    properties:
      id:
        type: string
        readOnly: true
      name:
        type: string
        example: "Automate Email Sending"
      nodes:
        type: array
        description: List of N8N nodes
        items:
          type: object
          additionalProperties: true
      connections:
        type: object
        description: Workflow connections
        additionalProperties: true
    # Using additionalProperties: true in the original route definition schema implies the structure is flexible,
    # but defining core structure here helps with documentation.
    additionalProperties: true

  WorkflowTemplate:
    type: object
    description: A stored workflow template record.
    properties:
      id:
        type: string
        format: uuid
        example: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
      name:
        type: string
        example: "Automate Email Sending"
      description:
        type: string
        example: "A template to trigger emails based on a webhook."
      n8n_json:
        type: object
        description: The full N8N workflow JSON content. Omitted if n8n_json query parameter is false.
        additionalProperties: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  Error:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
        example: "Invalid request data."
      details:
        type: object
        description: Additional error details or validation messages.
        additionalProperties: true
  

  /api/v1/todos:
    get:
      summary: List all todos for the authenticated user
      description: Retrieves all todos belonging to the authenticated user, optionally filtered by status or priority
      tags:
        - todos
      produces:
        - application/json
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status (todo, in_progress, done)
          required: false
          type: string
          enum:
            - todo
            - in_progress
            - done
        - name: priority
          in: query
          description: Filter by priority (high, medium, low)
          required: false
          type: string
          enum:
            - high
            - medium
