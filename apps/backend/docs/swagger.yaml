definitions:
  Todo:
    type: object
    description: A complete Todo item object
    properties:
      id:
        type: string
        format: uuid
        readOnly: true
      title:
        type: string
        example: "Finish API documentation"
      description:
        type: string
        example: "Write the swagger.yaml file for all todo routes."
      status:
        type: string
        enum:
          - todo
          - in_progress
          - done
        default: "todo"
      priority:
        type: string
        enum:
          - high
          - medium
          - low
        default: "medium"
      progress:
        type: integer
        minimum: 0
        maximum: 100
        default: 0
      user_id:
        type: string
        format: uuid
        readOnly: true
      organization_id:
        type: string
        format: uuid
        nullable: true
      created_at:
        type: string
        format: date-time
        readOnly: true
      updated_at:
        type: string
        format: date-time
        readOnly: true
      # Additional properties can be added here
    required:
      - id
      - title
      - status
      - priority
      - user_id

  NewTodo:
    type: object
    description: Data required to create a new Todo item
    properties:
      title:
        type: string
        example: "Write unit tests"
      description:
        type: string
        example: "Cover all new todo endpoints with tests."
      priority:
        type: string
        enum:
          - high
          - medium
          - low
        default: "medium"
      organization_id:
        type: string
        format: uuid
        nullable: true
    required:
      - title

  UpdateTodo:
    type: object
    description: Data for updating an existing Todo item
    properties:
      title:
        type: string
      description:
        type: string
      status:
        type: string
        enum:
          - todo
          - in_progress
          - done
      priority:
        type: string
        enum:
          - high
          - medium
          - low
      progress:
        type: integer
        minimum: 0
        maximum: 100
      organization_id:
        type: string
        format: uuid
        nullable: true
    # All properties are optional for a PUT/PATCH, as they represent the body for an update

  AgentTaskConfig:
    type: object
    description: Configuration for the scheduled agent task
    properties:
      agent_type:
        type: string
        example: "email_reminder"
        description: The type of agent to be scheduled
      schedule_time:
        type: string
        format: date-time
        example: "2025-12-15T10:00:00Z"
        description: The time to execute the agent task
      config_details:
        type: object
        description: Specific configuration for the agent task
        additionalProperties: true
    required:
      - agent_type
      - schedule_time

  Error:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
        example: "Unauthorized access. Please provide a valid Bearer token."
      details:
        type: object
        additionalProperties: true

  /api/v1/organizations:
  post:
    summary: Create an organization
    description: Creates a new organization and assigns the creator as an admin.
    tags:
      - organizations
    consumes:
      - application/json
    produces:
      - application/json
    security:
      - BearerAuth: []
    parameters:
      - name: organization
        in: body
        description: Organization data
        required: true
        schema:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            employee_count:
              type: integer
              minimum: 1
            ecommerce_domain:
              type: string
            industry:
              type: string
            company_size:
              type: string
            website:
              type: string
            country:
              type: string
            city:
              type: string
            address:
              type: string
            phone_number:
              type: string
            subscription_plan:
              type: string
          required:
            - name
            - employee_count
    responses:
      "201":
        description: Created
        schema:
          type: object
      "400":
        description: Bad Request
        schema:
          type: object
      "401":
        description: Unauthorized
        schema:
          type: object
      "500":
        description: Server Error
        schema:
          type: object

  get:
    summary: List organizations
    description: Retrieves all active organizations the authenticated user belongs to.
    tags:
      - organizations
    produces:
      - application/json
    security:
      - BearerAuth: []
    responses:
      "200":
        description: OK
        schema:
          type: object
          properties:
            organizations:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  employee_count:
                    type: integer
                  ecommerce_domain:
                    type: string
                  industry:
                    type: string
                  company_size:
                    type: string
                  website:
                    type: string
                  country:
                    type: string
                  city:
                    type: string
                  subscription_plan:
                    type: string
                  user_role:
                    type: string
                  joined_at:
                    type: string
                    format: date-time
      "400":
        description: Invalid user ID format
        schema:
          type: object
      "401":
        description: Unauthorized
        schema:
          type: object
      "500":
        description: Server error
        schema:
          type: object
  
