      - name: "invitationId"
        in: "path"
        required: true
        type: "string"
        description: "Invitation ID (UUID)"
    responses:
      "200":
        description: "Invitation cancelled successfully"
        schema:
          type: "object"
      "400":
        description: "Invalid request or invitation not pending"
        schema:
          type: "object"
      "401":
        description: "Unauthorized"
        schema:
          type: "object"
      "403":
        description: "Forbidden – only admins can cancel invitations"
        schema:
          type: "object"
      "404":
        description: "Invitation not found"
        schema:
          type: "object"
      "500":
        description: "Server error"
        schema:
          type: "object"

  /organizations/{id}/invitations/{invitationId}/resend:
   post:
    summary: "Resend invitation"
    description: "Allows an admin to resend an expired invitation, extending its expiration by 7 days."
    tags:
      - "invitations"
    produces:
      - "application/json"
    security:
      - BearerAuth: []
    parameters:
      - name: "id"
        in: "path"
        required: true
        type: "string"
        description: "Organization ID (UUID)"
      - name: "invitationId"
        in: "path"
        required: true
        type: "string"
        description: "Invitation ID (UUID)"
    responses:
      "200":
        description: "Invitation resent successfully"
        schema:
          type: "object"
          properties:
            invitationId:
              type: "string"
            status:
              type: "string"
            newExpiry:
              type: "string"
              format: "date-time"
      "400":
        description: "Invalid request or invitation not expired"
