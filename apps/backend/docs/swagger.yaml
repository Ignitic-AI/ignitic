          type: object

   post:
    summary: Add member to organization
    description: Allows an admin to add a member to the organization by email. If membership existed but inactive, reactivates it.
    tags:
      - members
    consumes:
      - application/json
    produces:
      - application/json
    security:
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        type: string
        description: Organization ID
      - name: memberData
        in: body
        required: true
        schema:
          type: object
          properties:
            email:
              type: string
            role:
              type: string
              enum:
                - admin
                - member
                - viewer
              default: member
    responses:
