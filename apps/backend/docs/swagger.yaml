swagger: "2.0"
basePath: /
host: localhost:8080
info:
  contact: {}
  description: API documentation for IgniticAI backend
  title: IgniticAI API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token
      parameters:
      - description: Login data
        in: body
        name: loginData
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - auth
  /api/v1/auth/profile:
    get:
      description: Returns the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user and sends a verification email
      parameters:
      - description: User registration data
        in: body
        name: userData
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verifies a user's email using a code
      parameters:
      - description: Verification code
        in: body
        name: verifyData
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Verify email
      tags:
      - auth
  /api/v1/secrets/{app}/{name}:
    put:
      consumes:
      - application/json
      description: Creates or updates a secret for an app and organization
      parameters:
      - name: app
        in: path
        required: true
        type: string
        description: App name
      - name: name
        in: path
        required: true
        type: string
        description: Secret name
      - name: body
        in: body
        required: true
        schema:
          type: object
        description: Secret data
      produces:
      - application/json
      responses:
        "201":
          description: Secret created successfully
          schema:
            type: object
        "200":
          description: Secret updated successfully
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: Create or update a secret
      tags:
      - secrets
    get:
      description: Retrieves and decrypts a secret for an app and organization
      parameters:
      - name: app
        in: path
        required: true
        type: string
        description: App name
      - name: name
        in: path
        required: true
        type: string
        description: Secret name
      produces:
      - application/json
      responses:
        "200":
          description: Decrypted secret
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
        "404":
          description: Secret not found
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: Get a secret
      tags:
      - secrets
    delete:
      description: Deletes a secret for an app and organization
      parameters:
      - name: app
        in: path
        required: true
        type: string
        description: App name
      - name: name
        in: path
        required: true
        type: string
        description: Secret name
      produces:
      - application/json
      responses:
        "200":
          description: Secret deleted successfully
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "404":
          description: Secret not found
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: Delete a secret
      tags:
      - secrets
  /api/v1/secrets/{app}:
    get:
      description: Lists all secrets for an app (without decryption)
      parameters:
      - name: app
        in: path
        required: true
        type: string
        description: App name
      produces:
      - application/json
      responses:
        "200":
          description: List of secrets
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: List secrets for an app
      tags:
      - secrets
  /api/v1/secrets/user/all:
    get:
      description: Lists all secrets for a user (personal + organization secrets they have access to)
      produces:
      - application/json
      responses:
        "200":
          description: List of secrets
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: List all secrets for a user
      tags:
      - secrets
  /api/v1/secrets/organization/{orgId}:
    get:
      description: Lists all secrets for an organization (only for admin/owner)
      parameters:
      - name: orgId
        in: path
        required: true
        type: string
        description: Organization ID
      produces:
      - application/json
      responses:
        "200":
          description: List of secrets
          schema:
            type: object
        "400":
          description: Invalid request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            type: object
        "500":
          description: Server error
          schema:
            type: object
      summary: List all secrets for an organization
      tags:
      - secrets

