  /organizations/{id}/invite:
   post:
    summary: "Invite member to organization"
    description: "Sends an invitation to a user via email to join an organization with a specified role. Only organization admins can send invitations."
    tags:
      - "invitations"
    consumes:
      - "application/json"
    produces:
      - "application/json"
    security:
      - BearerAuth: []
    parameters:
      - name: "id"
        in: "path"
        required: true
        type: "string"
        description: "Organization ID (UUID)"
      - name: "body"
        in: "body"
        required: true
        description: "Invitation request payload"
        schema:
          type: "object"
          properties:
            email:
              type: "string"
              format: "email"
            role:
              type: "string"
              enum: ["admin", "member", "viewer"]
    responses:
      "201":
        description: "Invitation sent successfully"
        schema:
          type: "object"
          properties:
            invitationId:
              type: "string"
            status:
              type: "string"
      "400":
        description: "Invalid request or ID format"
        schema:
          type: "object"
      "401":
        description: "Unauthorized"
        schema:
          type: "object"
      "403":
        description: "Forbidden – only admins can invite members"
        schema:
          type: "object"
      "404":
        description: "Organization not found"
        schema:
          type: "object"
      "409":
        description: "Conflict – user already a member or pending invitation exists"
        schema:
          type: "object"
      "500":
        description: "Server error"
        schema:
          type: "object"

  /invitations/{id}/accept:
   post:
    summary: "Accept invitation"
    description: "Allows a user to accept a pending organization invitation sent to their email."
    tags:
      - "invitations"
    produces:
      - "application/json"
    security:
      - BearerAuth: []
    parameters:
      - name: "id"
        in: "path"
        required: true
        type: "string"
        description: "Invitation ID (UUID)"
    responses:
      "200":
        description: "Successfully joined organization"
        schema:
          type: "object"
          properties:
            organizationId:
              type: "string"
            role:
              type: "string"
      "400":
        description: "Invalid request or invitation expired"
        schema:
          type: "object"
      "401":
        description: "Unauthorized"
        schema:
          type: "object"
      "403":
        description: "Forbidden – email mismatch"
        schema:
          type: "object"
      "404":
        description: "Invitation not found or already processed"
        schema:
          type: "object"
      "409":
        description: "Conflict – user already a member"
        schema:
          type: "object"
      "500":
        description: "Server error"
        schema:
          type: "object"

  /organizations/{id}/invitations:
   get:
    summary: "List organization invitations"
    description: "Retrieves all invitations (pending, expired, accepted) for a given organization. Only admins can view."
    tags:
      - "invitations"
    produces:
      - "application/json"
    security:
      - BearerAuth: []
    parameters:
      - name: "id"
        in: "path"
        required: true
        type: "string"
        description: "Organization ID (UUID)"
    responses:
      "200":
        description: "List of invitations"
        schema:
          type: "array"
          items:
            type: "object"
            properties:
              invitationId:
                type: "string"
              email:
                type: "string"
              role:
                type: "string"
              status:
                type: "string"
              expiresAt:
                type: "string"
                format: "date-time"
      "400":
        description: "Invalid request or ID format"
        schema:
          type: "object"
      "401":
        description: "Unauthorized"
        schema:
          type: "object"
