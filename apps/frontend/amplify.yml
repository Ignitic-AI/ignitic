# AWS Amplify Hosting — Next.js app (this file lives next to package.json).
#
# In Amplify Console: leave "Root directory" empty if this repo is only frontend,
# or set Root directory to "frontend" if this file sits inside a larger monorepo.
#
# Env vars (Console → Hosting → Environment variables):
#   NEXTAUTH_SECRET, NEXTAUTH_URL, NEXT_PUBLIC_API_URL, AUTH_TRUST_HOST (recommended), Cloudinary, etc.
#
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node -v
        - npm ci
    build:
      commands:
        # Amplify does not pass Console env vars to the SSR/Lambda runtime by default.
        # Next inlines values from .env.production at build time, so auth + public env must exist here before `next build`.
        # https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
        - touch .env.production
        - env | grep -e NEXTAUTH_SECRET -e AUTH_SECRET >> .env.production
        - env | grep -e NEXTAUTH_URL -e AUTH_TRUST_HOST >> .env.production || true
        - env | grep -e NEXT_PUBLIC_ >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
